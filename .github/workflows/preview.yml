name: Manual digest preview

on:
  workflow_dispatch:
    inputs:
      include_marker:
        description: Include the lane marker (false replaces the preview without it)
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # Delete only this run's temporary Pages artifact.

concurrency:
  group: digest-pages-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check existing Pages site (never enable it)
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 8.11.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck

      - name: Export one self-contained HTML page
        shell: bash
        env:
          INCLUDE_MARKER: ${{ inputs.include_marker }}
          LANE_MARKER: ${{ inputs.include_marker && secrets.LANE_MARKER || '' }}
          PORT: '8787'
        run: |
          set -euo pipefail
          if [[ "$INCLUDE_MARKER" == 'true' && -z "$LANE_MARKER" ]]; then
            echo '::error::Marked preview requested, but repository secret LANE_MARKER is missing.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/rig-preview"
          # Use rig's app and config, but bind explicitly to loopback and skip the heartbeat.
          node --import tsx --input-type=module -e '
            import { serve } from "@hono/node-server";
            import { createApp } from "./src/app.tsx";
            serve({ fetch: createApp().fetch, hostname: "127.0.0.1", port: 8787 });
          ' > "$RUNNER_TEMP/rig-preview-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --output /dev/null \
            --retry 20 --retry-delay 1 --retry-connrefused --retry-all-errors \
            --retry-max-time 45 --max-time 2 http://localhost:8787/health
          curl --fail --silent --show-error --max-time 10 \
            http://localhost:8787/digest/2026-10-28 > "$RUNNER_TEMP/rig-preview/index.html"

      - name: Upload temporary Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/rig-preview
          retention-days: 1

      - name: Deploy the stable root index.html
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Delete only this run's uploaded artifact
        if: ${{ always() && steps.upload.outputs.artifact_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID"

      - name: Remove runner-local preview files
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/rig-preview/index.html" \
            "$RUNNER_TEMP/rig-preview-server.log" "$RUNNER_TEMP/artifact.tar"
